[package]
name = "rune"
version = "0.15.0"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition = "2021"
rust-version = "1.95"
description = "The Rune Language, an embeddable dynamic programming language for Rust."
documentation = "https://docs.rs/rune"
readme = "README.md"
homepage = "https://github.com/rune-rs/rune"
repository = "https://github.com/rune-rs/rune"
license = "MIT OR Apache-2.0"
keywords = ["language", "scripting", "scripting-language"]
categories = ["parser-implementations"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rune_nightly, rune_docsrs, rune_byte_code)'] }

[features]
default = ["emit", "std", "anyhow"]
tracing = ["tracing/enabled"]
emit = ["std", "anyhow", "codespan-reporting"]
bench = []
workspace = ["std", "anyhow", "toml", "semver", "relative-path", "serde-hashkey", "linked-hash-map"]
doc = ["std", "anyhow", "rust-embed", "handlebars", "pulldown-cmark", "pulldown-cmark-escape", "syntect", "sha2", "base64", "rune-core/doc", "relative-path"]
cli = ["std", "anyhow", "emit", "doc", "tracing-subscriber", "clap", "webbrowser", "capture-io", "disable-io", "languageserver", "fmt", "similar", "rand", "musli/storage"]
languageserver = ["std", "anyhow", "lsp", "ropey", "percent-encoding", "url", "serde_json", "tokio", "workspace", "doc", "fmt"]
byte-code = ["alloc", "musli", "dep:musli", "musli/storage", "musli/std", "rune-alloc/std"]
capture-io = ["alloc", "parking_lot"]
disable-io = ["alloc"]
fmt = ["alloc", "anyhow"]
std = ["alloc", "serde/std", "rune-core/std", "rune-alloc/std", "musli?/std", "once_cell/std", "anyhow?/std", "syntree/std", "tokio?/io-std"]
alloc = ["rune-alloc/alloc", "rune-core/alloc", "once_cell/alloc", "serde?/alloc"]
musli = ["dep:musli-core", "rune-core/musli", "rune-alloc/musli"]
serde = ["dep:serde", "rune-alloc/serde", "relative-path?/serde"]
jit = ["alloc", "dep:wasm-encoder"]

[dependencies]
rune-macros = { version = "=0.15.0", path = "../rune-macros" }
rune-core = { version = "=0.15.0", path = "../rune-core", features = [] }
rune-alloc = { version = "0.15.0", path = "../rune-alloc", features = [], default-features = false }
tracing = { package = "rune-tracing", version = "0.15.0", path = "../rune-tracing" }

syntree = { version = "0.19.0", default-features = false, features = ["alloc"] }
futures-core = { version = "0.3.34", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
itoa = "1.0.18"
pin-project = "1.1.13"
ryu = "1.0.23"
serde = { version = "1.0.229", default-features = false, optional = true, features = ["derive", "rc"] }
musli = { version = "0.2.1", default-features = false, optional = true, features = ["alloc"] }
musli-core = { version = "0.2.0", default-features = false, optional = true, features = ["alloc"] }
wasm-encoder = { version = "0.263.0", default-features = false, optional = true }
once_cell = { version = "1.21.4", default-features = false, features = ["critical-section"] }

anyhow = { version = "1.0.104", default-features = false, optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
codespan-reporting = { version = "0.13.1", optional = true }
handlebars = { version = "6.4.4", optional = true }
pulldown-cmark = { version = "0.13.6", optional = true }
pulldown-cmark-escape = { version = "0.11.0", optional = true }
relative-path = { version = "2.0.3", optional = true, features = ["serde"] }
rust-embed = { version = "8.13.0", optional = true }
semver = { version = "1.0.28", optional = true, features = ["serde"] }
serde-hashkey = { version = "0.4.5", optional = true }
syntect = { version = "5.3.0", optional = true, default-features = false, features = ["default-fancy"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "fs", "macros", "sync", "io-util"], optional = true }
toml = { version = "1.2.0", optional = true, features = ["parse"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }
webbrowser = { version = "1.2.6", optional = true }
parking_lot = { version = "0.13.0", optional = true }
lsp = { version = "0.95.1", package = "lsp-types", optional = true }
ropey = { version = "1.6.1", optional = true }
percent-encoding = { version = "2.3.2", optional = true }
url = { version = "2.5.8", optional = true }
serde_json = { version = "1.0.154", optional = true }
linked-hash-map = { version = "0.5.6", optional = true }
similar = { version = "3.2.1", optional = true, features = ["inline", "bytes"] }
sha2 = { version = "0.11.1", optional = true }
base64 = { version = "0.23.1", optional = true }
rand = { version = "0.10.3", default-features = false, optional = true, features = ["thread_rng"] }
unicode-ident = "1.0.27"

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
static_assertions = "1.1.0"
futures-executor = "0.3.34"
trybuild = "1.0.122"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "rune_docsrs"]
